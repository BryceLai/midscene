name: midscene-webview-test
services:
  objectstore:
    image: chrislusf/seaweedfs:4.48
    working_dir: /data
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=512
      - -volume.max=8
    ports:
      - "127.0.0.1:28333:8333"
    volumes:
      - webview-s3-data:/data
      - ../.dev-s3/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped
volumes:
  webview-s3-data:
